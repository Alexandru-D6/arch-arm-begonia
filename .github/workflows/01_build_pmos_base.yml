name: "01 — Fetch pmOS base"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository producing the pmOS begonia artifact"
        default: "criollojoel10/begonia-postmarketos-build"
      source_run:
        description: "Upstream build number or run ID (blank for latest successful build with the artifact)"
        required: false

permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-libsparse-utils \
            --no-install-recommends

      - name: Resolve requested source run
        if: inputs.source_run != ''
        id: source
        env:
          GH_TOKEN: ${{ secrets.PMOS_PAT || github.token }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          id=$(gh run list --repo "$SOURCE_REPO" --workflow final.yaml --limit 100 \
            --json number,databaseId --jq ".[] | select(.number == $SOURCE_RUN) | .databaseId")
          echo "id=${id:-$SOURCE_RUN}" >> "$GITHUB_OUTPUT"

      - name: Download pmOS build
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.PMOS_PAT || github.token }}
          repo: ${{ inputs.source_repo }}
          workflow: final.yaml
          run_id: ${{ steps.source.outputs.id }}
          search_artifacts: true
          name: pmos-begonia-console-cross-true
          path: pmos

      - name: Extract boot files
        run: |
          mkdir -p out
          EXDIR=$(find pmos -type d -name "export" | head -1)
          [ -z "$EXDIR" ] && EXDIR="pmos"

          cp "$EXDIR/boot.img" out/boot.img
          [ -f "$EXDIR/vmlinuz" ] && cp "$EXDIR/vmlinuz" out/vmlinuz
          for f in "$EXDIR/initramfs" "$EXDIR/initramfs.gz" "$EXDIR/initrd.img"; do
            [ -f "$f" ] && cp "$f" out/initramfs && break
          done
          echo "=== out/ ==="; ls -lh out/

      - name: Scan and extract filesystems
        run: |
          SYSIMG=$(find pmos -name "xiaomi-begonia.img" | head -1)
          echo "System image: $(ls -lh $SYSIMG)"

          # Convert sparse -> raw
          file "$SYSIMG" | grep -q "sparse" && simg2img "$SYSIMG" system-raw.img || cp "$SYSIMG" system-raw.img
          echo "Raw image: $(ls -lh system-raw.img)"

          # Scan for ext4 partitions and extract modules/firmware
          python3 scripts/scan-extract-fs.py system-raw.img out

      - name: Verify content
        run: |
          echo "=== Final artifact contents ==="
          ls -lh out/
          echo ""
          echo "boot.img SHA256: $(sha256sum out/boot.img | cut -d' ' -f1)"
          echo ""
          if [ -f out/modules.tar.gz ]; then
            MOD_SIZE=$(ls -lh out/modules.tar.gz | awk '{print $5}')
            MOD_COUNT=$(tar -tzf out/modules.tar.gz | wc -l)
            echo "modules.tar.gz: $MOD_SIZE ($MOD_COUNT files)"
          else
            echo "❌ modules.tar.gz MISSING"
            exit 1
          fi
          if [ -f out/firmware.tar.gz ]; then
            echo "firmware.tar.gz: $(ls -lh out/firmware.tar.gz | awk '{print $5}')"
          else
            echo "❌ firmware.tar.gz MISSING"
          fi
          if [ -f out/initramfs ]; then ls -lh out/initramfs; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-base-begonia
          path: out/
          retention-days: 90
