name: "02 — Build Arch Linux ARM begonia (corrected)"

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: "Rootfs image size (GB)"
        default: "8"
      touchscreen_variant:
        description: "Touch panel firmware (Tianma verified on the development handset)"
        type: choice
        options: [tianma, csot]
        default: tianma

permissions:
  actions: read
  contents: write

env:
  ARCH_ROOTFS_URL: "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
  RTL8192EU_REPO: "https://github.com/clnhub/rtl8192eu-linux.git"
  LOCALVERSION: ""
  KERNEL_REPO: "https://gitlab.postmarketos.org/mt6785-mainline/linux.git"
  KERNEL_TAG: "6.16.4-r0"
  KERNEL_CONFIG_URL: "https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/ecd710af96ac54650e945a268639f4a7cbc47960/device/testing/linux-postmarketos-mediatek-mt6785/config-postmarketos-mediatek-mt6785.aarch64"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Check hardware setup helpers
        run: |
          python3 -m unittest discover -s tests -v
          bash -n boot/apply-kernel-audio.sh rootfs/install-audio.sh scripts/test-mic-aux.sh
          bash -n boot/apply-kernel-connectivity.sh boot/configure-kernel.sh rootfs/install-connectivity.sh
          sh -n rootfs/connectivity/begonia-wifi rootfs/connectivity/begonia-hotspot-test
          sh -n initramfs/charge-only.sh
          bash -n rootfs/install-livi.sh rootfs/livi/livi-power.sh
          bash -n rootfs/install-gps.sh scripts/build-gps-runtime.sh
          sh -n rootfs/livi/upstream/livi-touch-filter

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support build-essential \
            gcc-aarch64-linux-gnu kmod python3 python3-pip \
            --no-install-recommends
          bash boot/install-boot-tools.sh

      # ============================================================
      # Use pmOS base from workflow 01
      # boot.img = pmOS original (vendor kernel + DTB + pmOS initramfs)
      # modules/firmware = pmOS kernel modules
      # ============================================================
      - name: Download pmOS base
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          search_artifacts: true
          repo: ${{ github.repository }}

      - name: Download Arch rootfs
        run: |
          wget -q --show-progress "${{ env.ARCH_ROOTFS_URL }}" -O arch-rootfs.tar.gz
          ls -lh arch-rootfs.tar.gz

      - name: Create and mount rootfs image
        run: |
          truncate -s ${{ inputs.rootfs_size }}G rootfs.img
          mkfs.ext4 -F -L pmOS_root rootfs.img
          mkdir -p mnt
          sudo mount rootfs.img mnt

      - name: Extract Arch rootfs and pmOS firmware
        run: |
          sudo bsdtar -xpf arch-rootfs.tar.gz -C mnt
          sudo mkdir -p mnt/usr/lib
          if [ -f pmos-base/firmware.tar.gz ]; then
            sudo tar -xzf pmos-base/firmware.tar.gz -C mnt/usr/lib/
          fi

      # ============================================================
      # Build RTL8192EU (TP-Link WN821N) WiFi driver
      # ============================================================
      - name: Restore kernel source cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-kernel
          key: v2-kernel-${{ env.KERNEL_TAG }}

      - name: Clone kernel source (shallow, tag ${{ env.KERNEL_TAG }})
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KERNEL_TAG" \
            "$KERNEL_REPO" linux-kernel 2>&1 | tail -5
          test -d linux-kernel/.git || { echo 'ERROR: kernel clone failed'; exit 1; }

      - name: Prepare kernel build tree
        run: |
          test -d linux-kernel || { echo 'ERROR: linux-kernel/ not found'; exit 1; }
          wget -q "${{ env.KERNEL_CONFIG_URL }}" -O linux-kernel/.config
          cd linux-kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -5

      # ============================================================
      # Custom kernel build — enable Waydroid, audio, USB features
      # ============================================================
      - name: Enable Waydroid and hardware features in kernel
        run: |
          cd linux-kernel
          bash "$GITHUB_WORKSPACE/boot/configure-kernel.sh"

      - name: Build full kernel (Image.gz + modules + DTBs)
        run: |
          cd linux-kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz modules 2>&1 | tail -5
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs 2>&1 | tail -5
          echo "=== Kernel ==="
          ls -lh arch/arm64/boot/Image.gz
          echo "=== Modules ==="
          echo "$(find . -name '*.ko' | wc -l) modules built"
          echo "=== Release string ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null

      - name: Install custom kernel modules to rootfs
        run: |
          KVER=$(make -s -C linux-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
          # The pmOS ramdisk carries early-boot modules from this release.
          tar -tzf pmos-base/modules.tar.gz > "$RUNNER_TEMP/pmos-modules.list"
          grep -Fx "modules/$KVER/" "$RUNNER_TEMP/pmos-modules.list"
          sudo make -C linux-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION= INSTALL_MOD_PATH="$GITHUB_WORKSPACE/mnt" INSTALL_MOD_STRIP=1 modules_install
          sudo depmod -b mnt "$KVER"
          for driver in r8152 ax88179_178a smsc95xx; do
            modinfo -b mnt -k "$KVER" "$driver" > /dev/null
          done
          for driver in snd-soc-mt6785-begonia snd-soc-mt6359 mt6359-accdet snd-soc-begonia-tfa9874 i2c-gpio; do
            modinfo -b mnt -k "$KVER" "$driver" > /dev/null
          done
          for driver in mtk-vendor-btif wmt_drv wlan_gen4m hci_stp bluetooth rfcomm; do
            modinfo -b mnt -k "$KVER" "$driver" > /dev/null
          done
          modinfo -b mnt -k "$KVER" fuse > /dev/null
          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Install internal MediaTek Wi-Fi firmware and boot service
        run: sudo bash rootfs/install-connectivity.sh "$GITHUB_WORKSPACE/mnt"

      - name: Select touchscreen firmware
        env:
          TOUCH_VARIANT: ${{ inputs.touchscreen_variant || 'tianma' }}
        run: sudo bash rootfs/install-touchscreen.sh "$GITHUB_WORKSPACE/mnt" "$TOUCH_VARIANT"

      - name: Pack custom boot.img with new kernel
        run: |
          python3 scripts/repack-bootimg.py pmos-base/boot.img - - boot-begonia-arch.img \
            --modules-dir "mnt/usr/lib/modules/$KVER" \
            --charge-only \
            --touch-firmware mnt/usr/lib/firmware/novatek/nt36672a_begonia_csot.bin.zst \
            --extra-cmdline='video=DSI-1:panel_orientation=right_side_up' \
            --kernel linux-kernel/arch/arm64/boot/Image.gz \
            --dtb linux-kernel/arch/arm64/boot/dts/mediatek/mt6785-xiaomi-begonia.dtb

      - name: Build RTL8192EU driver
        run: |
          git clone --depth 1 ${{ env.RTL8192EU_REPO }} rtl8192eu-linux
          cd rtl8192eu-linux
          KSRC="${{ github.workspace }}/linux-kernel"
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM_AARCH64 = n/CONFIG_PLATFORM_ARM_AARCH64 = y/' Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KSRC="$KSRC" 2>&1 | tail -30
          ls -lh 8192eu.ko 2>/dev/null || { ls *.ko; false; }

      - name: Install WiFi driver to rootfs
        run: |
          MODDIR="mnt/usr/lib/modules/$KVER/extra"
          sudo mkdir -p "$MODDIR"
          sudo cp rtl8192eu-linux/8192eu.ko "$MODDIR/"
          sudo depmod -b mnt "$KVER"

          sudo mkdir -p mnt/etc/modprobe.d mnt/etc/modules-load.d
          printf '%s\n' \
            'blacklist rtl8xxxu' \
            'options 8192eu rtw_power_mgnt=0 rtw_enusbss=0' \
            | sudo tee mnt/etc/modprobe.d/rtl8192eu.conf > /dev/null
          echo '8192eu' | sudo tee mnt/etc/modules-load.d/rtl8192eu.conf > /dev/null

      # ============================================================
      # Chroot setup
      # ============================================================
      - name: Prepare chroot
        run: |
          sudo cp "$(which qemu-aarch64-static)" mnt/usr/bin/
          sudo mount -t proc proc mnt/proc
          sudo mount --bind /sys mnt/sys
          sudo mount --bind /dev mnt/dev
          sudo mount --bind /dev/pts mnt/dev/pts 2>/dev/null || true
          sudo rm -f mnt/etc/resolv.conf
          sudo bash -c 'cp /etc/resolv.conf mnt/etc/resolv.conf'
          sudo install -m644 linux-kernel/arch/arm64/boot/Image.gz mnt/boot/vmlinuz-linux
          sudo sed -i '/\[options\]/a DisableSandbox' mnt/etc/pacman.conf 2>/dev/null || true

      - name: Install packages (pacman in chroot)
        run: |
          sudo chroot mnt /bin/bash -c '
            pacman-key --init 2>&1
            pacman-key --populate archlinuxarm 2>&1
            pacman -Syu --noconfirm --needed \
              busybox \
              sudo vim nano git openssh rsync curl wget \
              networkmanager iwd wpa_supplicant iw dnsmasq bluez bluez-utils \
              htop tmux \
              alsa-utils alsa-ucm-conf \
              pipewire pipewire-audio pipewire-alsa pipewire-pulse wireplumber python 2>&1
          '

      # ============================================================
      # FIX CRÍTICO #2: /etc/fstab — previene wait_boot_partition
      # El pmOS initramfs (stage 2) verifica si fstab está vacío.
      # Si lo está, llama wait_boot_partition() que busca label
      # "pmOS_boot" por 30s y falla. Con fstab válido, lo skipea.
      # ============================================================
      - name: Create /etc/fstab
        run: |
          printf '%s\n' \
            '# /etc/fstab — Arch Linux ARM on begonia' \
            '' \
            'LABEL=pmOS_root  /  ext4  rw,noatime,nodiratime,data=ordered  0 1' \
            'tmpfs  /tmp  tmpfs  rw,nosuid,nodev,noexec,mode=1777  0 0' \
            | sudo tee mnt/etc/fstab > /dev/null
          cat mnt/etc/fstab

      - name: Enable services & create user
        run: |
          sudo chroot mnt /bin/bash -c '
            systemctl set-default multi-user.target
            systemctl enable sshd
            systemctl enable NetworkManager
            systemctl enable systemd-timesyncd
            useradd -m -s /bin/bash alarm 2>/dev/null || true
            echo "alarm:alarm" | chpasswd
            usermod -aG wheel alarm 2>/dev/null || true
            sed -i "s/# %wheel ALL=(ALL:ALL) ALL/%wheel ALL=(ALL:ALL) ALL/" /etc/sudoers
            echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          '

      - name: Install begonia AUX, speaker and internal microphone profile
        run: |
          sudo bash rootfs/install-audio.sh "$GITHUB_WORKSPACE/mnt" alarm
          test -f mnt/usr/share/alsa/ucm2/conf.d/begonia-aux/begonia-aux.conf
          test -f mnt/etc/wireplumber/wireplumber.conf.d/51-begonia-aux.conf
          test -x mnt/usr/local/bin/begonia-mic-aux-test

      - name: Install LIVI headless kiosk
        run: |
          sudo bash rootfs/install-livi.sh "$GITHUB_WORKSPACE/mnt" alarm
          test -x mnt/home/alarm/LIVI/LIVI.AppImage
          test -L mnt/etc/systemd/system/multi-user.target.wants/livi-kiosk.service
          test "$(readlink mnt/etc/systemd/system/getty@tty1.service)" = /dev/null

      - name: Build and install begonia internal GPS adapters
        run: |
          bash scripts/build-gps-runtime.sh "${ANDROID_NDK_HOME:?Android NDK is required}" "$RUNNER_TEMP/begonia-gps"
          sudo bash rootfs/install-gps.sh "$GITHUB_WORKSPACE/mnt" alarm "$RUNNER_TEMP/begonia-gps"
          test -x mnt/usr/local/lib/begonia-gps/begonia-gps
          test -L mnt/etc/systemd/system/livi-kiosk.service.wants/begonia-gps.service

      - name: Cleanup & release
        run: |
          sudo umount --recursive "$GITHUB_WORKSPACE/mnt"
          e2fsck -fn rootfs.img

          mkdir -p release
          mv boot-begonia-arch.img release/
          xz -9 -T 0 -f rootfs.img
          mv rootfs.img.xz release/rootfs-archlinuxarm-begonia-console.img.xz
          [ -f flash/flash-begonia-arch.sh ] && cp flash/flash-begonia-arch.sh release/
          cd release && sha256sum * > SHA256SUMS.txt && ls -lh && cd ..

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Arch Linux ARM for begonia (nightly)"
          body: |
            ## Arch Linux ARM for Xiaomi Redmi Note 8 Pro (begonia)

            **Kernel compilado custom con soporte para Waydroid + audio.**

            ### Novedades de esta build

            | Mejora | Detalle |
            |---|---|
            | **LIVI** | 10.5.0 ARM64 verificado por SHA-256; sustituye el terminal de tty1. Arranque automático y UI Panfrost probados en el teléfono; proyección pendiente |
            | 🐉 **Waydroid** | CGroups v1 habilitado → Android 13 (LineageOS) bootea dentro del contenedor |
            | 🔊 **Audio** | AUX + altavoz interno automático + micrófono interno, UCM2 y PipeWire; pruebas básicas en begonia, validación prolongada pendiente |
            | 🔌 **USB** | RTL8152 (Ethernet USB) + módems por puerto serie |
            | ⏻ **Apagado** | MT6359 PWRHOLD: arranque normal tras apagar, sin mantener pulsado 20 segundos |
            | 🔋 **Carga sin arrancar Arch** | USB mantiene la pantalla apagada; Power inicia Arch con confirmación por vibración |
            | 📦 **DM_VERITY** | Integridad de bloques para imágenes Android |
            | ⚡ **ZSWAP** | Compresión de swap en RAM (mejora rendimiento) |
            | 📡 **Netfilter** | Conntrack netlink + helpers NAT para contenedores |

            ### Kernel config flags activados
            ```
            CONFIG_MEMCG_V1=y
            CONFIG_CPUSETS_V1=y
            CONFIG_NF_CT_NETLINK=m
            CONFIG_SND_SOC_MT6359=m
            CONFIG_SND_SOC_MT6785_BEGONIA=m
            CONFIG_SND_SOC_MT6359_ACCDET=m
            CONFIG_MTK_ADSP_MBOX=m
            CONFIG_MTK_SCP=m
            CONFIG_USB_RTL8152=m
            CONFIG_DM_VERITY=m
            CONFIG_ZSWAP=y
            ```

            ### Flujo de boot (sin cambios)
            ```
            Bootloader → kernel custom 6.16.4 → pmOS initramfs
            → busca pmOS_root por label ✅
            → monta rootfs → verifica fstab (OK, no busca boot) 
            → switch_root → systemd de Arch Linux ARM 🚀
            ```

            **Kernel:** custom 6.16.4 (con MEMCG_V1 + CPUSETS_V1 + audio MT6359)
            **Initramfs:** pmOS con módulos del kernel compilado
            **Userspace:** Arch Linux ARM aarch64 (glibc, pacman, systemd)

            ### Install
            ```
            xz -d rootfs-archlinuxarm-begonia-console.img.xz
            fastboot format:ext4 userdata
            fastboot flash boot boot-begonia-arch.img
            fastboot flash userdata rootfs-archlinuxarm-begonia-console.img
            fastboot reboot
            ```

            **Login:** `alarm` / `alarm`

            LIVI arranca automáticamente en tty1; SSH sigue disponible. El nombre
            del rootfs conserva `console` por compatibilidad. Configura país,
            Wi-Fi y Bluetooth en LIVI antes de activar Android Auto inalámbrico.
            Based on LIVI by Lasse Heitgres (https://github.com/f-io/LIVI).
          prerelease: true
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: release/*
