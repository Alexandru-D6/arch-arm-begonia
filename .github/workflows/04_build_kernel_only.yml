name: "04 — Build kernel-only (boot.img) para begonia"

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "Kernel tag (rama pmOS mainline)"
        default: "6.16.4-r0"
      custom_cmdline:
        description: "Extra cmdline flags"
        default: "video=DSI-1:panel_orientation=right_side_up"
      touchscreen_variant:
        description: "Touch panel firmware (must match the rootfs selection)"
        type: choice
        options: [tianma, csot]
        default: tianma

permissions:
  actions: read
  contents: read

env:
  LOCALVERSION: ""
  KERNEL_REPO: "https://gitlab.postmarketos.org/mt6785-mainline/linux.git"
  KERNEL_TAG: ${{ github.event.inputs.kernel_tag || '6.16.4-r0' }}
  KERNEL_CONFIG_URL: "https://gitlab.postmarketos.org/postmarketOS/pmaports/-/raw/ecd710af96ac54650e945a268639f4a7cbc47960/device/testing/linux-postmarketos-mediatek-mt6785/config-postmarketos-mediatek-mt6785.aarch64"

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libarchive-tools xz-utils zstd e2fsprogs \
            qemu-user-static binfmt-support build-essential \
            gcc-aarch64-linux-gnu kmod python3 python3-pip \
            --no-install-recommends
          bash boot/install-boot-tools.sh

      # ============================================================
      # pmOS base (necesitamos boot.img para extraer ramdisk + repack)
      # ============================================================
      - name: Download pmOS base
        uses: dawidd6/action-download-artifact@v9
        with:
          name: pmos-base-begonia
          path: pmos-base
          workflow: 01_build_pmos_base.yml
          workflow_conclusion: success
          workflow_search: true
          search_artifacts: true
          repo: ${{ github.repository }}

      # ============================================================
      # Kernel source (cacheable)
      # ============================================================
      - name: Restore kernel source cache
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-kernel
          key: v2-kernel-${{ env.KERNEL_TAG }}

      - name: Clone kernel source (shallow, tag ${{ env.KERNEL_TAG }})
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$KERNEL_TAG" \
            "$KERNEL_REPO" linux-kernel 2>&1 | tail -5
          test -d linux-kernel/.git || { echo 'ERROR: kernel clone failed'; exit 1; }

      - name: Prepare kernel build tree
        run: |
          test -d linux-kernel || { echo 'ERROR: linux-kernel/ not found'; exit 1; }
          wget -q "${{ env.KERNEL_CONFIG_URL }}" -O linux-kernel/.config
          cd linux-kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -5

      # ============================================================
      # Enable Waydroid + hardware features
      # ============================================================
      - name: Enable Waydroid and hardware features in kernel
        run: |
          cd linux-kernel
          bash "$GITHUB_WORKSPACE/boot/configure-kernel.sh"

      - name: Build kernel (Image.gz + modules + DTBs)
        run: |
          cd linux-kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz modules 2>&1 | tail -5
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs 2>&1 | tail -5
          echo "=== Kernel built ==="
          ls -lh arch/arm64/boot/Image.gz
          echo "Modules: $(find . -name '*.ko' | wc -l)"
          echo "Release: $(make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null)"

      # ============================================================
      # Pack boot.img (reemplazar kernel + DTB, conservar ramdisk)
      # ============================================================
      - name: Stage compiled modules for the pmOS ramdisk
        run: |
          KVER=$(make -s -C linux-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
          make -C linux-kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$RUNNER_TEMP/modroot" INSTALL_MOD_STRIP=1 modules_install
          depmod -b "$RUNNER_TEMP/modroot" "$KVER"
          echo "KVER=$KVER" >> "$GITHUB_ENV"

      - name: Pack custom boot.img with new kernel
        env:
          EXTRA_CMDLINE: ${{ inputs.custom_cmdline }}
          TOUCH_VARIANT: ${{ inputs.touchscreen_variant || 'tianma' }}
        run: |
          bash rootfs/install-touchscreen.sh "$RUNNER_TEMP/touch-firmware" "$TOUCH_VARIANT"
          python3 scripts/repack-bootimg.py pmos-base/boot.img - - boot-begonia-kernel.img \
            --touch-firmware "$RUNNER_TEMP/touch-firmware/usr/lib/firmware/novatek/nt36672a_begonia_csot.bin.zst" \
            --modules-dir "$RUNNER_TEMP/modroot/lib/modules/$KVER" \
            --kernel linux-kernel/arch/arm64/boot/Image.gz \
            --dtb linux-kernel/arch/arm64/boot/dts/mediatek/mt6785-xiaomi-begonia.dtb \
            --extra-cmdline="$EXTRA_CMDLINE"

      - name: Upload kernel boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-begonia-kernel
          path: boot-begonia-kernel.img
          compression-level: 0
          retention-days: 7
