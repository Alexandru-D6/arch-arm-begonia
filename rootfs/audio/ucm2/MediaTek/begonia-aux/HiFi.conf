SectionVerb {
    EnableSequence [
        cset "name='DAC In Mux' 'Normal Path'"
        cset "name='AIF Out Mux' 'Normal Path'"
    ]
    DisableSequence [
        cset "name='HP Mux' Open"
        cset "name='ADC_L_Mux' Idle"
        cset "name='PGA_L_Mux' None"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Headphones" {
    Comment "Car AUX (3.5 mm stereo)"
    EnableSequence [
        cset "name='HP Mux' 'Audio Playback'"
    ]
    DisableSequence [
        cset "name='HP Mux' Open"
    ]
    Value {
        PlaybackPriority 1000
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
        PlaybackVolume "name='Headset Volume'"
        JackControl "AUX Jack"
    }
}

# The only capture device is the main handset microphone on AIN0/MICBIAS0.
# It has no JackControl: AUX insertion must never remove or replace this input.
# Duplicate the mono ADC onto both MTKAIF channels for the stereo DMA interface.
SectionDevice."Mic1" {
    Comment "Internal microphone"
    EnableSequence [
        cset "name='Internal Mic Switch' on"
        cset "name='UL_SRC_MUX' AMIC"
        cset "name='ADC_L_Mux' 'Left Preamplifier'"
        cset "name='PGA_L_Mux' AIN0"
        cset "name='ADC_R_Mux' Idle"
        cset "name='PGA_R_Mux' None"
        cset "name='MISO0_MUX' UL1_CH1"
        cset "name='MISO1_MUX' UL1_CH1"
    ]
    DisableSequence [
        cset "name='ADC_L_Mux' Idle"
        cset "name='PGA_L_Mux' None"
        cset "name='Internal Mic Switch' off"
    ]
    Value {
        CapturePriority 1000
        CapturePCM "hw:${CardId},1"
        CaptureChannels 2
        CaptureRate 48000
        CaptureVolume "name='PGA1 Volume'"
    }
}
