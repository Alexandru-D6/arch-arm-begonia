# WirePlumber 0.5+. These rules only affect the onboard begonia sound card.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" api.alsa.card.name = "begonia-aux" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = true
        api.acp.auto-profile = false
        api.acp.auto-port = false
        device.profile = "HiFi"
        device.description = "Begonia AUX, speaker and internal microphone"
      }
    }
  }
  {
    matches = [ {
      node.name = "~alsa_output.*HiFi__Headphones__sink"
      api.alsa.card.name = "begonia-aux"
    } ]
    actions = {
      update-props = {
        node.name = "begonia_aux_output"
        node.description = "Car AUX"
        audio.rate = 48000
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [ {
      node.name = "~alsa_output.*HiFi__Speaker__sink"
      api.alsa.card.name = "begonia-aux"
    } ]
    actions = {
      update-props = {
        node.name = "begonia_speaker_output"
        node.description = "Internal speaker"
        audio.rate = 48000
        audio.format = "S16LE"
        audio.channels = 1
        audio.position = [ MONO ]
        priority.session = 1000
        session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    matches = [ { media.class = "Audio/Source" api.alsa.card.name = "begonia-aux" } ]
    actions = {
      update-props = {
        node.name = "begonia_internal_mic"
        node.description = "Begonia internal microphone"
        audio.rate = 48000
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
