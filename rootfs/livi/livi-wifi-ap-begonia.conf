# The vendor radio cannot keep a 5 GHz AP alongside a 2.4 GHz station.
# LIVI owns ap0; keep NetworkManager from reconnecting either station interface.
[Unit]
Requires=begonia-wifi.service NetworkManager.service
After=begonia-wifi.service NetworkManager.service begonia-hotspot.service
Conflicts=begonia-hotspot.service

[Service]
ExecStartPre=/usr/bin/nmcli device set wlan0 managed no
ExecStartPre=/usr/bin/nmcli device set wlan1 managed no
